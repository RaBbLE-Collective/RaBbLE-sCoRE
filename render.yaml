services:
  - type: web
    name: RaBbLE-sCoRE
    runtime: python
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: PORT
        value: "10000"
      - key: DEMO_MODE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: RABBLE_ADMIN_KEY
        sync: false
      # Comma list, exact-match CORS origins (server/main.py _cors_origins).
      # dev + chrysalis channels added S234 so previews reach the live backend.
      - key: FRONTEND_URL
        value: "https://joinrabble.world,https://dev.joinrabble.world,https://chrysalis.joinrabble.world"
      # Free tier = no persistent disk. Ephemeral storage; data resets on
      # restart/cold-sleep. Client state lives in the browser (localStorage).
      - key: DATA_DIR
        value: "/tmp/rabble-data"
      # Transcript persistence — training/tuning data (no user identity stored).
      # Flip TRANSCRIPT_BACKEND to "r2" and fill CF_* once a Cloudflare R2 bucket
      # is provisioned. Until then, transcripts write to DATA_DIR/transcripts/
      # (ephemeral on Render free tier, durable locally).
      # R2 token requires Workers R2 Storage:Edit permission on the target bucket.
      - key: TRANSCRIPT_BACKEND
        value: "file"
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_R2_TOKEN
        sync: false
      - key: CF_R2_BUCKET
        sync: false
      # Cloud fast tier: skip claude_code/local_llm (unavailable on Render) and
      # go straight to the OpenRouter free model — no failover latency.
      - key: LLM_FAST_CHAIN
        value: "openrouter:google/gemma-4-26b-a4b-it:free"
    plan: free
    healthCheckPath: /health
