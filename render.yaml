services:
  - type: web
    name: RaBbLE-sCoRE
    runtime: python
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: PORT
        value: "10000"
      - key: DEMO_MODE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: RABBLE_ADMIN_KEY
        sync: false
      - key: FRONTEND_URL
        value: "https://joinrabble.world"
      # Free tier = no persistent disk. Ephemeral storage; data resets on
      # restart/cold-sleep. Client state lives in the browser (localStorage).
      - key: DATA_DIR
        value: "/tmp/rabble-data"
      # Cloud fast tier: skip claude_code/local_llm (unavailable on Render) and
      # go straight to the OpenRouter free model — no failover latency.
      - key: LLM_FAST_CHAIN
        value: "openrouter:google/gemma-4-26b-a4b-it:free"
    plan: free
    healthCheckPath: /health
