name: Deploy sCoRE CF Proxy to Cloudflare Workers

on:
  push:
    branches: [main, new-horizons]
    paths: ['cf-proxy.js', 'wrangler.jsonc', '.github/workflows/deploy-proxy.yml']
    tags: ['v*']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy sCoRE CF Proxy Worker
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via Wrangler
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
