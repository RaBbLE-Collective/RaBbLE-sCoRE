[workspace]
resolver = "2"
members = ["rabble-proto", "rabble-theme", "rabble-face", "rabble-tui", "bench"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license-file = "../LICENSE"
publish = false

[workspace.dependencies]
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
debug = 1
